<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b10" />
    <meta name="description" content="Unofficial Noita companion: wand simulator, spell & perk database, materials and alchemy." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Ultimate Noita Companion</title>
    <style>
      /* Static pre-splash so there is never a white flash before JS boots */
      html, body { margin: 0; background: #0d0b10; }
      #boot { position: fixed; inset: 0; background: #0d0b10; }
      /* The wand exactly where the splash holds it (see wandGrip/GRIP in src/app/Splash.tsx): 3 CSS px per game px, 4 from 768px. */
      #boot img { position: absolute; width: 54px; height: 27px; image-rendering: pixelated;
        left: calc(50% - min(150px, 28vw) - 6px); top: calc(50% + 130px - 13.5px);
        transform-origin: 6px 13.5px; transform: rotate(-40deg); filter: drop-shadow(0 0 6px #6fd6ff88); }
      @media (min-width: 768px) {
        #boot img { width: 72px; height: 36px; left: calc(50% - 158px); top: calc(50% + 112px); transform-origin: 8px 18px; }
      }
    </style>
  </head>
  <body>
    <div id="boot"><img src="/icons/wand.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
